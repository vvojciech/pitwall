<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitwall</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="bar">
  <div class="brand">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V4h9a5 5 0 0 1 0 10H4" /><path d="M14 20h6" /></svg>
    <span>Pitwall</span>
  </div>
  <div class="summary" id="summary"></div>
  <button class="update-btn" id="update" hidden></button>
  <button class="icon-btn" id="race" title="Start an agent race" aria-label="Start an agent race">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 22V4"/><path d="M4 4h12l-2 4 2 4H4"/></svg>
  </button>
  <button class="icon-btn" id="settings" title="Settings: switch features off" aria-label="Settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
  </button>
  <div class="order" role="group" aria-label="Order the agents">
    <span>Order</span>
    <div class="seg" id="order">
      <button data-order="tabs" title="As your windows, tabs and panes are">Tabs</button>
      <button data-order="activity" title="Agents that need you first, then the most recent">Activity</button>
    </div>
    <span class="bgcount" id="bgcount" title="Background tasks and scheduled prompts across all agents"></span>
  </div>
</header>
<main id="cards" aria-live="polite"></main>
<footer class="usage-bar" id="usage" aria-label="Plan usage"></footer>
<div class="toast" id="toast" role="status"></div>
<script src="/tooltip.js"></script>
<script src="/features.js"></script>
<script src="/races.js"></script>
<script src="/usage.js"></script>
<script src="/map.js"></script>
<script src="/settings.js"></script>
<script src="/app.js"></script>
<script src="/cards.js"></script>
</body>
</html>
